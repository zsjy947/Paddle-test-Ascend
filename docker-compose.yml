services:
  docparse-npu:
    build:
      context: .
      dockerfile: Dockerfile
    image: docparse-npu:v1
    container_name: docparse-dev
    shm_size: "128G"
    working_dir: /app
    devices:
      - /dev/davinci2
      - /dev/davinci_manager
      - /dev/devmm_svm
      - /dev/hisi_hdc
    volumes:
      # 相对路径挂载仓库本身（compose 按项目目录解析，不依赖 HOME 环境变量）
      - .:/app/paddle
      - /data1/models:/app/models
      - /usr/local/Ascend/driver:/usr/local/Ascend/driver
      - /usr/local/bin/npu-smi:/usr/local/bin/npu-smi
      - /usr/local/dcmi:/usr/local/dcmi
      - /etc/ascend_install.info:/etc/ascend_install.info
    environment:
      # 容器内逻辑编号（只挂 davinci2 → 逻辑表仅一条：物理2→逻辑0），
      # 写物理号 2 会越界导致可见设备集为空（aclInit 107001 Invalid device ID）
      - ASCEND_RT_VISIBLE_DEVICES=0
      # bridge 网络下经 compose 服务名访问 vLLM（覆盖 config.yaml 的 localhost 默认值）
      - VLLM_SERVER_URL=http://vllm-ascend:${VLLM_PORT:-8000}/v1
    stdin_open: true
    tty: true
    command: /bin/bash
    restart: unless-stopped
    depends_on:
      # service_started 而非 service_healthy：drawbridge 部署的 compose up --wait
      # 超时（约 2 分钟）远小于 vLLM 在 NPU 上的模型加载时间，等 healthy 必然部署失败；
      # vLLM 就绪由 docparse 客户端自身探测（docparse/client.py wait_vllm）兜底
      vllm-ascend:
        condition: service_started
    # 只启动开发容器（不等待 vLLM）时：docker compose up -d --no-deps docparse-npu

  vllm-ascend:
    image: quay.io/ascend/vllm-ascend:v0.19.1rc1-openeuler
    container_name: vllm-ascend
    shm_size: "1g"
    working_dir: /app
    devices:
      - /dev/davinci2
      - /dev/davinci_manager
      - /dev/devmm_svm
      - /dev/hisi_hdc
    ports:
      # 宿主机 8000 已被占用，固定映射到 8312（容器内仍监听 VLLM_PORT）
      - "${VLLM_HOST_PORT:-8312}:${VLLM_PORT:-8000}"
    volumes:
      - /data1/models:/app/models
      - .:/app/paddle
      - /usr/local/dcmi:/usr/local/dcmi
      - /usr/local/Ascend/driver/tools/hccn_tool:/usr/local/Ascend/driver/tools/hccn_tool
      - /usr/local/bin/npu-smi:/usr/local/bin/npu-smi
      - /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/
      - /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info
      - /etc/ascend_install.info:/etc/ascend_install.info
    environment:
      # 容器内逻辑编号（只挂 davinci2 → 逻辑表仅一条：物理2→逻辑0），含义同 docparse-npu
      - ASCEND_RT_VISIBLE_DEVICES=0
      # 把 compose 插值结果传入容器，.env / shell 中修改下列变量才能真正生效（start_vllm.sh 读取）
      - VLLM_PORT=${VLLM_PORT:-8000}
      - VLLM_MODEL_PATH=${VLLM_MODEL_PATH:-/app/models/PaddlePaddle/PaddleOCR-VL}
      - VLLM_MODEL_NAME=${VLLM_MODEL_NAME:-PaddleOCR-VL-0.9B}
      - VLLM_MAX_BATCHED_TOKENS=${VLLM_MAX_BATCHED_TOKENS:-16384}
    stdin_open: true
    tty: true
    command: bash /app/paddle/scripts/start_vllm.sh
    restart: unless-stopped
    # 不定义 healthcheck：compose up --wait 会等服务 healthy，而 vLLM 模型加载
    # 耗时数分钟，超过 drawbridge 部署等待窗口；就绪探测交给调用方（docparse/client.py）
