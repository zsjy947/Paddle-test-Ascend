services:
  docparse-npu:
    build: .
    image: docparse-npu:v1
    container_name: docparse-dev
    privileged: true
    network_mode: host
    shm_size: "128G"
    working_dir: /app
    volumes:
      - ${HOME}/paddle:/app/paddle
      - /data1/models:/app/models
      - /usr/local/Ascend/driver:/usr/local/Ascend/driver
      - /usr/local/bin/npu-smi:/usr/local/bin/npu-smi
      - /usr/local/dcmi:/usr/local/dcmi
    environment:
      - ASCEND_RT_VISIBLE_DEVICES=3,4,5,6
    stdin_open: true
    tty: true
    command: /bin/bash
    restart: unless-stopped
    depends_on:
      vllm-ascend:
        condition: service_healthy
    # 只启动开发容器（不等待 vLLM）时：docker compose up -d --no-deps docparse-npu

  vllm-ascend:
    image: quay.io/ascend/vllm-ascend:v0.19.1rc1-openeuler
    container_name: vllm-ascend
    privileged: true
    network_mode: host
    shm_size: "1g"
    working_dir: /app
    devices:
      - /dev/davinci_manager
      - /dev/devmm_svm
      - /dev/hisi_hdc
    volumes:
      - /data1/models:/app/models
      - ${HOME}/paddle:/app/paddle
      - /usr/local/dcmi:/usr/local/dcmi
      - /usr/local/Ascend/driver/tools/hccn_tool:/usr/local/Ascend/driver/tools/hccn_tool
      - /usr/local/bin/npu-smi:/usr/local/bin/npu-smi
      - /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/
      - /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info
      - /etc/ascend_install.info:/etc/ascend_install.info
    environment:
      - ASCEND_RT_VISIBLE_DEVICES=3
    stdin_open: true
    tty: true
    command: bash /app/paddle/scripts/start_vllm.sh
    restart: unless-stopped
    healthcheck:
      # NPU 上模型加载耗时较长，start_period 给足余量；端口与 start_vllm.sh 的 VLLM_PORT 保持一致
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${VLLM_PORT:-8000}/v1/models', timeout=10)"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 600s
